name: Build Tauri APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-tauri:
    name: Build Tauri Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: cd lx-music-tauri && npm install

      - name: Build frontend
        run: cd lx-music-tauri && npm run build

      - name: Install Rust and targets
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          source $HOME/.cargo/env
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Install Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install Rust Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android

      - name: Build Rust backend
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_TARGET_DIR: /tmp/tauri-target
        run: |
          cd lx-music-tauri/src-tauri
          cargo build --release --target aarch64-linux-android
          cargo build --release --target armv7-linux-androideabi
          cargo build --release --target x86_64-linux-android

      - name: Get package version
        id: version
        run: |
          PACKAGE_VERSION=$(node -p "require('./lx-music-tauri/package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-tauri-v${{ steps.version.outputs.PACKAGE_VERSION }}-arm64
          path: lx-music-tauri/src-tauri/target/aarch64-linux-android/release/bundle/apk/*.apk