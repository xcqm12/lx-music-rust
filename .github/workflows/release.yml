name: Build

on:
  push:
    branches:
      - main
      - lx-music-rust-old

jobs:
  Android:
    name: Android
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Build Packages
        env:
          DISABLE_SVG: 1
          GRADLE_OPTS: "-Xmx6144m -XX:MaxMetaspaceSize=2048m"
          NDK_VERSION: "26.1.10909125"
        shell: bash
        run: |
          export ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}
          if [ ! -d "$ANDROID_NDK_HOME" ]; then
            echo "NDK ${NDK_VERSION} not preinstalled on runner, installing via sdkmanager..."
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          fi
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}" >> $GITHUB_ENV
          
          cargo install cargo-ndk

          # app 内声明 JNI 符号的是 cn.toside.music.mobile.RustBridge（对应 src/rust 的导出），
          # 必须编译 src/rust；rust-core 的符号（com_lx_music_core_RustCoreBridge_*）无 Kotlin 声明
          cd src/rust
          cargo ndk -t armeabi-v7a -t arm64-v8a -t x86 -t x86_64 -o ../../android/app/src/main/jniLibs build --release

          cd ../../android
          chmod +x gradlew
          if [ -n "${{ secrets.KEYSTORE_STORE_FILE_BASE64 }}" ] && [ -n "${{ secrets.KEYSTORE_STORE_FILE }}" ]; then
            echo "${{ secrets.KEYSTORE_STORE_FILE_BASE64 }}" | base64 --decode > app/${{ secrets.KEYSTORE_STORE_FILE }}
            ./gradlew assembleRelease --no-daemon -PMYAPP_UPLOAD_STORE_FILE='${{ secrets.KEYSTORE_STORE_FILE }}' -PMYAPP_UPLOAD_KEY_ALIAS='${{ secrets.KEYSTORE_KEY_ALIAS }}' -PMYAPP_UPLOAD_STORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' -PMYAPP_UPLOAD_KEY_PASSWORD='${{ secrets.KEYSTORE_KEY_PASSWORD }}'
            rm -f app/${{ secrets.KEYSTORE_STORE_FILE }}
          else
            ./gradlew assembleRelease --no-daemon
          fi

      # 防签名静默回退：secrets 任一为空时 build.gradle 会回退 debug.keystore（CN=Android Debug），
      # 覆盖安装已发布的 SevenZeroMeowTeam 版本会失败，必须在此拦截
      - name: Verify APK signature (guard against silent debug fallback)
        shell: bash
        run: |
          APKSIGNER="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          APK="$(ls android/app/build/outputs/apk/release/*-armeabi-v7a.apk | head -1)"
          echo "Verifying: $APK"
          CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$CERTS"
          if echo "$CERTS" | grep -qi "Android Debug"; then
            echo "::error::Release APK 使用了 debug 签名（secrets 缺失导致回退），拒绝发布"
            exit 1
          fi

      # Push tag to GitHub if package.json version's tag is not tagged
      - name: Get package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Create git tag
        shell: bash
        run: |
          TAG_NAME="v${PACKAGE_VERSION}"
          # checkout 默认不取 tags，须查远端，否则已存在的 tag 会 push 被拒
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists remotely, skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"
          fi

      - name: Generate file MD5
        run: |
          cd android/app/build/outputs/apk/release
          md5sum *.apk

      - name: Upload Artifact
        uses: ./.github/actions/upload-artifact
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}

