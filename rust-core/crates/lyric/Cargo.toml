[package]
name = "lyric"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }

# 异步运行时
tokio = { version = "1.0", features = ["full"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 错误处理
thiserror = "1.0"

# 时间处理
chrono = "0.4"

# 正则表达式
regex = "1.10"

# 歌词解析
nom = "7.1"

# 缓存
dashmap = "6.0"

[dev-dependencies]
tokio-test = "0.4"
