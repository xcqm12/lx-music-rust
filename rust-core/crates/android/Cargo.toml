[package]
name = "lx-music-android"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
common = { path = "../common" }
player = { path = "../player" }
music-source = { path = "../music-source" }
lyric = { path = "../lyric" }

# 异步运行时
tokio = { version = "1.0", features = ["full"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# JNI 绑定
jni = { version = "0.21", features = ["invocation"] }

# 日志
log = "0.4"
android_logger = "0.14"

# 错误处理
thiserror = "1.0"


