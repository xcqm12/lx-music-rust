[package]
name = "music-source"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }

# HTTP 客户端
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# 异步运行时
tokio = { version = "1.0", features = ["full"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 加密/解密
aes = "0.8"
cipher = "0.4"
md5 = "0.7"
base64 = "0.22"
hex = "0.4"
rsa = "0.9"

# 压缩
flate2 = "1.0"

# HTML/XML 解析
html5ever = "0.27"
scraper = "0.21"
quick-xml = "0.36"

# 其他工具
regex = "1.10"
url = "2.5"
once_cell = "1.19"
dashmap = "6.0"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
