[package]
name = "lx-music-core"
version = "1.0.0"
edition = "2021"
description = "LX Music Core - Rust implementation for music playback, source parsing, and lyric processing"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
once_cell = "1.19"
thiserror = "1.0"
hex = "0.4"
base64 = "0.22"
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
rand = "0.8"
sha2 = "0.10"
crossbeam-channel = "0.5"
chrono = "0.4"
url = "2.5"
regex = "1.10"

# Symphonia audio decoding engine
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "flac", "isomp4", "wav", "pcm"] }

# QuickJS JavaScript engine for custom music source scripts
rquickjs = { version = "0.6", features = ["bindgen", "full-async"], optional = true }

[lib]
name = "lx_music_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []  # Disable JS engine by default on Windows
js-engine = ["dep:rquickjs"]

# Android JNI support
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# Desktop JNI support (for testing)
[target.'cfg(not(target_os = "android"))'.dependencies]
jni = "0.21"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Android NDK cross-compilation settings
[profile.release.package.rquickjs]
opt-level = 2